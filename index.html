<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + safe-area en el CSS para que el notch del iPhone no tape nada -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>zgym</title>

<!-- Instalable en pantalla de inicio (iOS: solo desde Safari) -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="zgym">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app" aria-live="polite"></div>

<div id="toast" class="toast" role="status" hidden></div>

<!-- Barra de descanso: fija abajo, solo visible con el temporizador activo -->
<div id="rest" class="rest" hidden>
  <div class="rest-time"><span id="rest-count">0:00</span></div>
  <div class="rest-meta">
    <strong id="rest-label">Descanso</strong>
    <span id="rest-sub">objetivo 2′30″</span>
  </div>
  <button id="rest-add" class="rest-btn" type="button">+30 s</button>
  <button id="rest-skip" class="rest-btn" type="button">Saltar</button>
</div>

<script type="module" src="./app.js"></script>
<script>
  // Service worker solo en http(s): con file:// falla y no aporta nada.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
